name: Cleanup Old Artifacts

on:
  schedule:
    # Run every week on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            // Keep artifacts from the last 7 days
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - 7);
            
            const artifactsToDelete = artifacts.data.artifacts.filter(artifact => {
              const createdDate = new Date(artifact.created_at);
              return createdDate < cutoffDate;
            });
            
            console.log(`Found ${artifactsToDelete.length} artifacts to delete`);
            
            for (const artifact of artifactsToDelete) {
              console.log(`Deleting artifact: ${artifact.name} (created: ${artifact.created_at})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
            
            console.log(`Deleted ${artifactsToDelete.length} artifacts`);