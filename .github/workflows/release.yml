name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: DevManager-windows
            zip_cmd: powershell -Command "Compress-Archive -Path dist\DevManager\* -DestinationPath dist\DevManager-windows.zip"
            zip_file: dist/DevManager-windows.zip
          - os: macos-latest
            artifact_name: DevManager-macos
            zip_cmd: cd dist && zip -r ../DevManager-macos.zip DevManager
            zip_file: dist/DevManager-macos.zip
          - os: ubuntu-latest
            artifact_name: DevManager-linux
            zip_cmd: cd dist && zip -r ../DevManager-linux.zip DevManager
            zip_file: dist/DevManager-linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller devManager.spec

      - name: Create zip
        run: ${{ matrix.zip_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_file }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
