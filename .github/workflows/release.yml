name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller devManager.spec

      - name: Create zip
        run: Compress-Archive -Path dist\DevManager\* -DestinationPath dist\DevManager-windows.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist\DevManager-windows.zip
          generate_release_notes: true
