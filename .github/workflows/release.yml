name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.1)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub release automatically'
        required: false
        type: boolean
        default: false

env:
  WAILS_VERSION: v2.15.0

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          
          # Check if this is a prerelease (contains alpha, beta, rc)
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "Prerelease: $IS_PRERELEASE"

      - name: Validate version consistency
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Check version in files
          HTML_VERSION=$(grep -o 'v[0-9]*\.[0-9]*\.[0-9]*' devmanager-app/frontend/index.html || echo "not found")
          PACKAGE_VERSION=$(grep -o '"version": "[^"]*"' devmanager-app/frontend/package.json | cut -d'"' -f4 || echo "not found")
          WAILS_VERSION=$(grep -o '"productVersion": "[^"]*"' devmanager-app/wails.json | cut -d'"' -f4 || echo "not found")
          
          echo "HTML version: $HTML_VERSION"
          echo "Package version: $PACKAGE_VERSION"
          echo "Wails version: $WAILS_VERSION"
          echo "Expected version: v$VERSION / $VERSION"
          
          # Validate versions match
          # Check versions but warn instead of failing for frontend package.json
          # (frontend version may differ from app version)
          if [[ "$HTML_VERSION" != "v$VERSION" ]]; then
            echo "⚠️ HTML version ($HTML_VERSION) doesn't match tag (v$VERSION)"
          fi
          
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "⚠️ Frontend package version ($PACKAGE_VERSION) doesn't match tag ($VERSION)"
          fi
          
          if [[ "$WAILS_VERSION" != "$VERSION" ]]; then
            echo "❌ Wails product version ($WAILS_VERSION) doesn't match tag ($VERSION)"
            exit 1
          fi
          
          echo "✅ Version validation passed"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          if [[ -f "CHANGELOG.md" ]]; then
            # Extract changelog for this version
            CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | head -n -1)
            
            if [[ -z "$CHANGELOG" ]]; then
              echo "No changelog found for version $VERSION, using default"
              CHANGELOG="## [$VERSION] - $(date +%Y-%m-%d)

### 📦 Downloads
This release includes binaries for:
- Windows (amd64, arm64)
- macOS (amd64, arm64)
- Linux (amd64, arm64)"
            fi
            
            # Escape for JSON
            CHANGELOG_ESCAPED=$(echo "$CHANGELOG" | jq -Rs .)
            echo "changelog=$CHANGELOG_ESCAPED" >> $GITHUB_OUTPUT
          else
            echo "No CHANGELOG.md found"
            echo "changelog=Release $VERSION" >> $GITHUB_OUTPUT
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            platform: windows
            arch: amd64
            artifact_name: devmanager-windows-amd64.exe
            artifact_zip: devmanager-windows-amd64.zip
          - os: windows-latest
            platform: windows
            arch: arm64
            artifact_name: devmanager-windows-arm64.exe
            artifact_zip: devmanager-windows-arm64.zip
          
          # macOS builds
          - os: macos-latest
            platform: darwin
            arch: amd64
            artifact_name: devmanager-macos-amd64
            artifact_zip: devmanager-macos-amd64.zip
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact_name: devmanager-macos-arm64
            artifact_zip: devmanager-macos-arm64.zip
          
          # Linux builds
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            artifact_name: devmanager-linux-amd64
            artifact_zip: devmanager-linux-amd64.zip
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            artifact_name: devmanager-linux-arm64
            artifact_zip: devmanager-linux-arm64.zip

    runs-on: ${{ matrix.os }}
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: devmanager-app/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Set up Wails dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Wails dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Install Xcode command line tools if not present
          xcode-select --install || true

      - name: Install frontend dependencies
        working-directory: ./devmanager-app/frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: ./devmanager-app/frontend
        run: npm run build

      - name: Build Wails application
        working-directory: ./devmanager-app
        run: |
          wails build -platform ${{ matrix.platform }}/${{ matrix.arch }} -clean
        env:
          CGO_ENABLED: 1

      - name: Verify build output
        working-directory: ./devmanager-app
        shell: bash
        run: |
          echo "Build directory contents:"
          ls -la build/bin/ || true
          echo "Platform-specific directory:"
          ls -la build/bin/${{ matrix.platform }}-${{ matrix.arch }}/ || true

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $artifactPath = "devmanager-app/build/bin/${{ matrix.platform }}-${{ matrix.arch }}/"
          $exeName = "devmanager.exe"
          $sourcePath = Join-Path $artifactPath $exeName
          $destPath = "${{ matrix.artifact_name }}"
          if (Test-Path $sourcePath) {
            Copy-Item $sourcePath $destPath
            Compress-Archive -Path $destPath -DestinationPath ${{ matrix.artifact_zip }}
          } else {
            Write-Error "Executable not found at $sourcePath"
            Get-ChildItem -Path $artifactPath -Recurse
          }

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd devmanager-app/build/bin/${{ matrix.platform }}-${{ matrix.arch }}/
          chmod +x devmanager
          cp devmanager ../../../../../${{ matrix.artifact_name }}
          cd ../../../../../
          zip ${{ matrix.artifact_zip }} ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_zip }}
          path: ${{ matrix.artifact_zip }}
          retention-days: 30

  create-release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: devManager v${{ needs.validate.outputs.version }}
          body: ${{ needs.validate.outputs.changelog }}
          files: artifacts/**/*.zip
          draft: false
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    if: always()
    needs: [validate, build, create-release]
    runs-on: ubuntu-latest
    
    steps:
      - name: Build Summary
        run: |
          echo "# Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Prerelease:** ${{ needs.validate.outputs.is_prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | amd64 | ${{ contains(needs.build.result, 'success') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | arm64 | ${{ contains(needs.build.result, 'success') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | amd64 | ${{ contains(needs.build.result, 'success') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | arm64 | ${{ contains(needs.build.result, 'success') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | amd64 | ${{ contains(needs.build.result, 'success') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | arm64 | ${{ contains(needs.build.result, 'success') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Release Status" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.create-release.result }}" == "success" ]]; then
            echo "✅ Release created successfully" >> $GITHUB_STEP_SUMMARY
            echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.validate.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.create-release.result }}" == "skipped" ]]; then
            echo "⏭️ Release creation skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Release creation failed" >> $GITHUB_STEP_SUMMARY
          fi