name: Matrix Debug
on: [push]

jobs:
  pre:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: echo 'matrix=[{"os":"ubuntu-22.04","arch":"amd64"}]' >> "$GITHUB_OUTPUT"
      - name: show output
        run: cat "$GITHUB_OUTPUT"

  debug:
    needs: pre
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "raw: ${{ needs.pre.outputs.matrix }}"
          echo "parsed: ${{ fromJSON(needs.pre.outputs.matrix) }}"

  build:
    needs: pre
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pre.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "hi ${{ matrix.arch }}"