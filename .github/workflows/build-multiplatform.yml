name: Build Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        default: 'dev'

env:
  WAILS_VERSION: v2.15.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            platform: windows
            arch: amd64
            artifact_name: devmanager-windows-amd64.exe
            artifact_zip: devmanager-windows-amd64.zip
          - os: windows-latest
            platform: windows
            arch: arm64
            artifact_name: devmanager-windows-arm64.exe
            artifact_zip: devmanager-windows-arm64.zip
          
          # macOS builds
          - os: macos-latest
            platform: darwin
            label: macos
            arch: amd64
            artifact_name: devmanager-macos-amd64
            artifact_zip: devmanager-macos-amd64.zip
          - os: macos-latest
            platform: darwin
            label: macos
            arch: arm64
            artifact_name: devmanager-macos-arm64
            artifact_zip: devmanager-macos-arm64.zip
          
          # Linux builds
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
            artifact_name: devmanager-linux-amd64
            artifact_zip: devmanager-linux-amd64.zip
          # Runner arm64 NATIVO: cross-compilar linux/arm64 con CGO (GTK+WebKit)
          # desde runner x64 falla en el ensamblado gcc_arm64.S (toolchain x86 no
          # soporta AArch64). En un runner arm64 la celda compila nativo.
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            artifact_name: devmanager-linux-arm64
            artifact_zip: devmanager-linux-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: devmanager-app/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Set up Wails dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev dbus dbus-x11 xvfb

      - name: Set up Wails dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Install Xcode command line tools if not present
          xcode-select --install || true

      - name: Install frontend dependencies
        working-directory: ./devmanager-app/frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: ./devmanager-app/frontend
        run: npm run build

      - name: Build Wails application (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: ./devmanager-app
        run: |
          eval "$(dbus-launch --sh-syntax)"
          # En cross-compilación a arm64, Wails regenera los bindings ejecutando
          # un binario del host (amd64) que arranca el systray y crashea en su
          # teardown (godbus SIGSEGV) al morir la sesión dbus sintética. Los
          # bindings ya están commiteados en frontend/wailsjs, así que se pueden
          # saltar sin perder nada. La celda amd64 (nativa) no se toca.
          SKIP_BINDINGS=""
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            SKIP_BINDINGS="-skipbindings"
          fi
          xvfb-run wails build -platform ${{ matrix.platform }}/${{ matrix.arch }} -clean $SKIP_BINDINGS
        env:
          CGO_ENABLED: 1

      - name: Build Wails application (non-Linux)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        working-directory: ./devmanager-app
        run: |
          wails build -platform ${{ matrix.platform }}/${{ matrix.arch }} -clean
        env:
          CGO_ENABLED: 1

      - name: Verify build output
        working-directory: ./devmanager-app
        shell: bash
        run: |
          echo "Build directory contents:"
          find build/bin -type f 2>/dev/null || echo "No files in build/bin"
          ls -la build/bin/ || true

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path devmanager-app/build/bin -Filter devmanager.exe -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "devmanager.exe not found"
            Get-ChildItem -Path devmanager-app/build -Recurse -File
            exit 1
          }
          Copy-Item $exe.FullName "${{ matrix.artifact_name }}"
          Compress-Archive -Path "${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.artifact_zip }}"

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          # Wails outputs to build/bin/<name> (no extension)
          BIN=$(find devmanager-app/build/bin -name 'devmanager' -type f | head -1)
          if [ -z "$BIN" ]; then
            echo "ERROR: devmanager binary not found"
            find devmanager-app/build -type f
            exit 1
          fi
          cp "$BIN" "${{ matrix.artifact_name }}"
          zip "${{ matrix.artifact_zip }}" "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_zip }}
          path: ${{ matrix.artifact_zip }}
          retention-days: 30

      # Estado por celda del matrix para el resumen: corre SIEMPRE (if: always)
      # para que una variante fallida también se reporte. Escribe su propio
      # artifact para que build-summary pueda leer el resultado de cada
      # plataforma de forma determinista (los outputs de un job matrix no se
      # pueden combinar por celda; GitHub Actions solo expone uno arbitrario).
      - name: Record build status
        if: always()
        shell: bash
        run: |
          mkdir -p status
          # label (platform mostrada al usuario) > matrix.platform interna (darwin)
          cell="${{ matrix.label || matrix.platform }}-${{ matrix.arch }}"
          echo "${{ job.status }}" > "status/${cell}.txt"
          cat "status/${cell}.txt"

      - name: Upload build status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-status-${{ matrix.label || matrix.platform }}-${{ matrix.arch }}
          path: status/${{ matrix.label || matrix.platform }}-${{ matrix.arch }}.txt
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-summary:
    name: 📊 Resultado
    if: always()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download build status artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-status-*
          path: status

      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|--------|" >> $GITHUB_STEP_SUMMARY

          # Devuelve ⚠ skipped/n/a si el archivo de estado no existe, o el
          # resultado real (success/failure) leído del artifact por celda.
          status() {
            local f="status/build-status-$1/$1.txt"
            if [ ! -f "$f" ]; then
              echo "n/a"
              return
            fi
            cat "$f"
          }

          for cell in "windows:amd64" "windows:arm64" "macos:amd64" "macos:arm64" "linux:amd64" "linux:arm64"; do
            plat="${cell%%:*}"
            arch="${cell##*:}"
            echo "| $plat | $arch | $(status "${plat}-${arch}") |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build job: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY